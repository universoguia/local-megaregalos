document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

elative;overflow:hidden\">\n              <div style=\"display:grid;grid-template-columns:repeat(21,6px);grid-template-rows:repeat(21,6px);opacity:.45\">\n                <sc-for list=\"{{ qrCells }}\" as=\"q\" hint-placeholder-count=\"441\">\n                  <span style=\"display:block;background:{{ q.bg }}\"><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <span style=\"position:absolute;left:0;right:0;height:3px;background:#FFC629;animation:mrScan 1s ease-in-out infinite\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:14px;font-weight:700;color:#4A4350\">Leyendo código…<\u002Fdiv>\n            <div style=\"font-size:12px;color:#6B6270;text-align:center;line-height:1.5;text-wrap:pretty\">Simulación: no se solicita acceso a la cámara.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ scanFound }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:16px 18px 20px;display:flex;flex-direction:column;gap:13px\">\n            <div style=\"display:flex;gap:12px;align-items:center\">\n              <span style=\"width:64px;height:64px;border-radius:12px;background-color:#F4F1F6;background-image:{{ qrImage }};background-size:cover;background-position:center;flex:0 0 auto;display:block\"><\u002Fspan>\n              <span style=\"min-width:0;flex:1\">\n                <span style=\"display:block;font-size:14.5px;font-weight:700;line-height:1.35;text-wrap:pretty\">{{ qrName }}<\u002Fspan>\n                <span style=\"display:block;font-size:12.5px;color:#6B6270;margin-top:2px\">SKU {{ qrSkuLabel }}<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:8px;margin-top:6px\">\n                  <strong style=\"font-family:Outfit,sans-serif;font-size:16px;font-weight:700\">{{ qrStock }} u<\u002Fstrong>\n                  <span style=\"font-size:12px;font-weight:700;color:{{ qrStInk }};background:{{ qrStBg }};border-radius:20px;padd 1EA;background:#ffffff;color:#4A4350;font-size:13.5px;font-weight:700;border-radius:10px;padding:10px 15px;cursor:pointer\" style-hover=\"border-color:#7B1FA2\">Cancelar<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ confirmOk }}\" style=\"border:0;background:#B3261E;color:#ffffff;font-size:13.5px;font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer\" style-hover=\"filter:brightness(1.1)\">{{ confirmCta }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div role=\"status\" style=\"position:fixed;left:50%;bottom:26px;z-index:90;background:#1E1A21;color:#ffffff;border-radius:12px;padding:13px 17px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 34px rgba(30,26,33,.32);max-width:min(560px,92vw);animation:mrToast .22s ease\">\n      <span style=\"width:8px;height:8px;border-radius:50%;background:{{ toastDot }};display:block;flex:0 0 auto\"><\u002Fspan>\n      <span style=\"font-size:14px;line-height:1.4\">{{ toast }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ closeToast }}\" aria-label=\"Cerrar aviso\" style=\"border:0;background:none;color:#C9C2CE;font-size:16px;cursor:pointer;padding:2px 4px;flex:0 0 auto\">✕<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showDemoAccounts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo&quot;,&quot;label&quot;:&quot;Mostrar accesos demo en el login&quot;},&quot;demoClock&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026-08-27T14:20:00&quot;,&quot;tsType&quot;:&quot;string | null&quot;,&quot;section&quot;:&quot;Demo&quot;,&quot;label&quot;:&quot;Reloj demo (ISO). Vacío = reloj real&quot;}}\">\n/* =========================================================================\n   MegaRegalos · dominio canónico v0.0.2\n   Sin campos legacy (delivery/pay/payStatus/state) ni enums legacy.\n   Capas: catálogo → seed → dominio (transiciones + RBAC) → selectores → UI.\n   ========================================================================= */\n\nconst ARS = n => '$' + n.toLocaleString('es-AR');\n\n/* ---------- Sucursales ---------- */\n/* Local único de la demo: José C. Paz. Sin multisucursal ni selectores. */\nconst BRANCHES = [\n  { id: 'b5', name: 'MegaRegalos José C. Paz', addr: 'Hipólito Yrigoyen 1851' }\n];\nconst BRANCH = BRANCHES[0];\nconst BR = {}; BRANCHES.forEach(b => { BR[b.id] = b; });\n\n/* ---------- Catálogo (Product.price = precio actual) ---------- */\nconst PRODUCTS = {\n  'MR-JUG-001': { sku: 'MR-JUG-001', name: 'Bloques magnéticos 48 piezas', price: 22900, img: 'assets/n01.jpg', category: 'Juguetería' },\n  'MR-JUG-002': { sku: 'MR-JUG-002', name: 'Auto a fricción rescate 30 cm', price: 8900, img: 'assets/n02.jpg', category: 'Juguetería' },\n  'MR-JUG-003': { sku: 'MR-JUG-003', name: 'Peluche dinosaurio 35 cm', price: 9400, img: 'assets/n03.jpg', category: 'Juguetería' },\n  'MR-JUG-004': { sku: 'MR-JUG-004', name: 'Set doctor con maletín 18 piezas', price: 13200, img: 'assets/n04.jpg', category: 'Juguetería' },\n  'MR-JUG-005': { sku: 'MR-JUG-005', name: 'Pista de autos con loop 240 cm', price: 28500, img: 'assets/n05.jpg', category: 'Juguetería' },\n  'MR-BAZ-001': { sku: 'MR-BAZ-001', name: 'Set 12 vasos vidrio bajos', price: 15900, img: 'assets/n06.jpg', category: 'Bazar' }\n};\n\n/* ---------- Enums ---------- */\nconst ORDER_STATUS = ['pending_payment', 'preparing', 'packed', 'ready_for_pickup', 'shipped', 'delivered', 'cancelled'];\nconst STATUS_META = {\n  pending_payment: { label: 'Pago pendiente', ink: '#B07800', bg: '#FFF6E0' },\n  preparing: { label: 'En preparación', ink: '#7B1FA2', bg: '#F3F0FA' },\n  packed: { label: 'Empaquetado', ink: '#8A5A00', bg: '#FFF1D6' },\n  ready_for_pickup: { label: 'Listo p/ retiro', ink: '#3E7A12', bg: '#EEF7E6' },\n  shipped: { label: 'Despachado', ink: '#1D7CB8', bg: '#EDF4FB' },\n  delivered: { label: 'Entregado', ink: '#6B6270', bg: '#F0EDF2' },\n  cancelled: { label: 'Cancelado', ink: '#B3261E', bg: '#FDECEA' }\n};\nconst PAYMENT_METHOD_LABEL = { mercadopago: 'Mercado Pago', transfer: 'Transferencia', card: 'Tarjeta de crédito', cash: 'Efectivo en sucursal' };\nconst PAYMENT_STATUS_META = {\n  pending: { label: 'Pendiente', ink: '#B07800' },\n  approved: { label: 'Aprobado', ink: '#3E7A12' },\n  rejected: { label: 'Rechazado', ink: '#B3261E' },\n  refunded: { label: 'Reintegrado', ink: '#6B6270' }\n};\nconst FULFILLMENT_LABEL = { pickup: 'Retiro en sucursal', shipping: 'Envío a domicilio' };\n\n/* Secuencia por modalidad: pickup no usa `packed` como paso visible,\n   shipping separa `packed` (embalado) de `shipped` (entregado a logística). */\nconst FLOW = {\n  pickup: ['pending_payment', 'preparing', 'ready_for_pickup', 'delivered'],\n  shipping: ['pending_payment', 'preparing', 'packed', 'shipped', 'delivered']\n};\n\n/* ---------- Roles / acciones ---------- */\nconst ROLE_LABEL = { admin: 'Administrador', encargado: 'Encargado', empleado: 'Empleado' };\nconst ROLE_DESC = {\n  admin: 'Acceso total, incluida la gestión de usuarios y accesos.',\n  encargado: 'Opera pedidos, productos e inventario. Sin administración de usuarios.',\n  empleado: 'Opera la cola diaria de preparación y consulta. Sin configuraciones sensibles.'\n};\nconst ROLE_ACTIONS = {\n  admin: ['approve_payment', 'reject_payment', 'start_preparing', 'mark_packed', 'mark_ready_for_pickup', 'mark_shipped', 'mark_delivered', 'cancel'],\n  encargado: ['approve_payment', 'reject_payment', 'start_preparing', 'mark_packed', 'mark_ready_for_pickup', 'mark_shipped', 'mark_delivered', 'cancel'],\n  empleado: ['start_preparing', 'mark_packed', 'mark_ready_for_pickup']\n};\nconst ACTION_LABEL = {\n  approve_payment: 'Aprobar pago',\n  reject_payment: 'Rechazar pago',\n  start_preparing: 'Empezar a preparar',\n  mark_packed: 'Marcar empaquetado',\n  mark_ready_for_pickup: 'Marcar listo para retirar',\n  mark_shipped: 'Entregar a logística',\n  mark_delivered: 'Marcar entregado',\n  cancel: 'Cancelar pedido'\n};\nconst ACTION_SHORT = {\n  approve_payment: 'Validar', reject_payment: 'Rechazar', start_preparing: 'Preparar',\n  mark_packed: 'Empacado', mark_ready_for_pickup: 'Listo', mark_shipped: 'Despachar',\n  mark_delivered: 'Entregar', cancel: 'Cancelar'\n};\n\n/* ---------- Reglas de pago ----------\n   Sólo el efectivo en sucursal puede avanzar con paymentStatus === 'pending'.\n   Transferencia / MP / tarjeta pendientes bloquean el inicio de preparación. */\nconst paymentBlocksFulfilment = o => o.paymentStatus === 'pending' && o.paymentMethod !== 'cash';\n\n/* ---------- Motor de transiciones ---------- */\nfunction nextActionFor(o) {\n  if (o.orderStatus === 'pending_payment') return o.paymentMethod === 'cash' || o.paymentStatus === 'approved' ? 'start_preparing' : null;\n  if (o.orderStatus === 'preparing') return o.fulfillmentType === 'shipping' ? 'mark_packed' : 'mark_ready_for_pickup';\n  if (o.orderStatus === 'packed') return 'mark_shipped';\n  if (o.orderStatus === 'ready_for_pickup') return 'mark_delivered';\n  if (o.orderStatus === 'shipped') return 'mark_delivered';\n  return null;\n}\n\n/* Precondiciones de estado por acción (independientes del rol). */\nconst STATE_GUARD = {\n  approve_payment: o => o.paymentStatus === 'pending' && o.paymentMethod === 'transfer' && o.orderStatus === 'pending_payment',\n  reject_payment: o => o.paymentStatus === 'pending' && o.paymentMethod === 'transfer' && o.orderStatus === 'pending_payment',\n  start_preparing: o => o.orderStatus === 'pending_payment',\n  mark_packed: o => o.orderStatus === 'preparing' && o.fulfillmentType === 'shipping',\n  mark_ready_for_pickup: o => o.orderStatus === 'preparing' && o.fulfillmentType === 'pickup',\n  mark_shipped: o => o.orderStatus === 'packed',\n  mark_delivered: o => o.orderStatus === 'ready_for_pickup' || o.orderStatus === 'shipped',\n  cancel: o => ['pending_payment', 'preparing', 'packed', 'ready_for_pickup'].indexOf(o.orderStatus) >= 0\n};\n\n/**\n * Única fuente de autorización de la UI.\n * @returns {{ok:boolean, reason?:string}}\n */\nfunction canTransition(order, action, actor) {\n  if (!order || !action) return { ok: false, reason: 'Acción inexistente.' };\n  if ((ROLE_ACTIONS[actor.role] || []).indexOf(action) < 0)\n    return { ok: false, reason: 'El rol ' + ROLE_LABEL[actor.role] + ' no está autorizado a ' + ACTION_LABEL[action].toLowerCase() + '.' };\n  if (!(STATE_GUARD[action] || (() => false))(order))\n    return { ok: false, reason: 'La acción no corresponde al estado actual (' + STATUS_META[order.orderStatus].label + ').' };\n  if (action === 'start_preparing' && paymentBlocksFulfilment(order))\n    return { ok: false, reason: 'El pago por ' + PAYMENT_METHOD_LABEL[order.paymentMethod] + ' está pendiente: no puede iniciarse la preparación hasta que se acredite.' };\n  return { ok: true };\n}\n\n/**\n * Devuelve el parche canónico de la transición, o null si no está permitida.\n * Cada retorno representa UNA operación atómica (futuro RPC de Supabase).\n */\nfunction transitionOrder(order, action, actor) {\n  const check = canTransition(order, action, actor);\n  if (!check.ok) return null;\n  switch (action) {\n    case 'approve_payment': return { paymentStatus: 'approved' };\n    case 'reject_payment': return { paymentStatus: 'rejected', orderStatus: 'cancelled' };\n    case 'start_preparing': return { orderStatus: 'preparing' };\n    case 'mark_packed': return { orderStatus: 'packed' };\n    case 'mark_ready_for_pickup': return { orderStatus: 'ready_for_pickup' };\n    case 'mark_shipped': return { orderStatus: 'shipped' };\n    case 'mark_delivered':\n      // Efectivo en sucursal: cobro + entrega en una sola operación.\n      return order.paymentMethod === 'cash' && order.paymentStatus === 'pending'\n        ? { orderStatus: 'delivered', paymentStatus: 'approved' }\n        : { orderStatus: 'delivered' };\n    case 'cancel': return { orderStatus: 'cancelled' };\n    default: return null;\n  }\n}\n\n/* ---------- Teléfono E.164 ---------- */\nfunction toE164(local) {\n  const d = String(local).replace(/\\D/g, '');\n  if (!d) return '';\n  return '549' + d; // AR móvil: 54 + 9 + área + número\n}\nconst prettyE164 = e => '+' + e;\n\n/* ---------- WhatsApp según ESTADO real ---------- */\nfunction waTemplate(o) {\n  const first = o.client.split(' ')[0];\n  const br = BR[o.branchId];\n  if (o.orderStatus === 'preparing' && o.paymentMethod === 'transfer' && o.paymentStatus === 'approved')\n    return { key: 'payment_approved', label: 'Avisar acreditación a ' + first, text: '¡Hola ' + first + '! Confirmamos la acreditación de tu transferencia por el pedido ' + o.id + '. Ya empezamos a armarlo y te avisamos en cuanto esté. ¡Gracias por comprar en MegaRegalos!' };\n  if (o.orderStatus === 'ready_for_pickup')\n    return { key: 'ready_for_pickup', label: 'Avisar retiro a ' + first, text: '¡Hola ' + first + '! Tu pedido ' + o.id + ' ya está listo para retirar en ' + br.name + ' (' + br.addr + '). Te esperamos de lunes a sábado de 9 a 20 h. ¡Gracias por comprar en MegaRegalos!' };\n  if (o.orderStatus === 'shipped')\n    return { key: 'shipped', label: 'Avisar despacho a ' + first, text: '¡Hola ' + first + '! Tu pedido ' + o.id + ' fue despachado y está en camino a ' + o.deliveryAddress + '. El repartidor te va a contactar al llegar. ¡Gracias por comprar en MegaRegalos!' };\n  return null;\n}\n\n/* ---------- Datos semilla migrados al contrato canónico ---------- */\nconst SEED = [\n  { id: 'MR-10435', createdAt: '2026-08-27T13:10:00', client: 'Carla Medina', phone: '11 4102-7745', dni: '44.902.118', fulfillmentType: 'pickup', branchId: 'b2', deliveryAddress: null, paymentMethod: 'mercadopago', paymentStatus: 'approved', orderStatus: 'ready_for_pickup', shippingCost: 0, isGift: true, giftMessage: '¡Gracias por todo, Sole! Con cariño, Carla.', transferProofUrl: null, items: [['MR-JUG-004', 1]] },\n  { id: 'MR-10436', createdAt: '2026-08-27T14:05:00', client: 'Ramiro Ledesma', phone: '11 5877-2043', dni: '35.660.921', fulfillmentType: 'pickup', branchId: 'b1', deliveryAddress: null, paymentMethod: 'mercadopago', paymentStatus: 'approved', orderStatus: 'preparing', shippingCost: 0, isGift: false, giftMessage: '', transferProofUrl: null, items: [['MR-JUG-005', 1]] },\n  { id: 'MR-10434', createdAt: '2026-08-27T12:40:00', client: 'Diego Ferreyra', phone: '11 2298-6631', dni: '36.771.208', fulfillmentType: 'shipping', branchId: 'b3', deliveryAddress: 'Ruta 197 y Colectora 480, Don Torcuato', paymentMethod: 'card', paymentStatus: 'approved', orderStatus: 'shipped', shippingCost: 4900, isGift: false, giftMessage: '', transferProofUrl: null, items: [['MR-JUG-001', 1]] },\n  { id: 'MR-10433', createdAt: '2026-08-27T11:26:00', client: 'Mariana Duarte', phone: '11 3390-7752', dni: '29.554.010', fulfillmentType: 'pickup', branchId: 'b1', deliveryAddress: null, paymentMethod: 'mercadopago', paymentStatus: 'approved', orderStatus: 'preparing', shippingCost: 0, isGift: false, giftMessage: '', transferProofUrl: null, items: [['MR-JUG-004', 2], ['MR-JUG-002', 1]] },\n  { id: 'MR-10432', createdAt: '2026-08-27T10:02:00', client: 'Gonzalo Sena', phone: '11 6712-4409', dni: '33.087.145', fulfillmentType: 'shipping', branchId: 'b1', deliveryAddress: 'Av. Cazón 1244, Tigre', paymentMethod: 'transfer', paymentStatus: 'pending', orderStatus: 'pending_payment', shippingCost: 5400, isGift: false, giftMessage: '', transferProofUrl: 'fixture:comprobante-demo', items: [['MR-BAZ-001', 1], ['MR-JUG-004', 1]] },\n  { id: 'MR-10431', createdAt: '2026-08-27T09:15:00', client: 'Lucía Benítez', phone: '11 4478-2290', dni: '41.220.883', fulfillmentType: 'pickup', branchId: 'b4', deliveryAddress: null, paymentMethod: 'transfer', paymentStatus: 'pending', orderStatus: 'pending_payment', shippingCost: 0, isGift: true, giftMessage: 'Para Emma, ¡feliz cumple 7!', transferProofUrl: null, items: [['MR-JUG-005', 1], ['MR-JUG-002', 2]] },\n  { id: 'MR-10430', createdAt: '2026-08-27T08:48:00', client: 'Sofía Aguirre', phone: '11 5510-3388', dni: '40.115.667', fulfillmentType: 'pickup', branchId: 'b3', deliveryAddress: null, paymentMethod: 'cash', paymentStatus: 'pending', orderStatus: 'preparing', shippingCost: 0, isGift: false, giftMessage: '', transferProofUrl: null, items: [['MR-BAZ-001', 2]] },\n  { id: 'MR-10429', createdAt: '2026-08-26T19:05:00', client: 'Valeria Ojeda', phone: '11 5188-6621', dni: '32.470.559', fulfillmentType: 'shipping', branchId: 'b2', deliveryAddress: 'Belgrano 2210, Escobar', paymentMethod: 'mercadopago', paymentStatus: 'approved', orderStatus: 'packed', shippingCost: 4900, isGift: false, giftMessage: '', transferProofUrl: null, items: [['MR-JUG-003', 2], ['MR-JUG-002', 1]] },\n  { id: 'MR-10428', createdAt: '2026-08-26T18:40:00', client: 'Facundo Ríos', phone: '11 5623-8814', dni: '38.914.552', fulfillmentType: 'pickup', branchId: 'b1', deliveryAddress: null, paymentMethod: 'mercadopago', paymentStatus: 'approved', orderStatus: 'ready_for_pickup', shippingCost: 0, isGift: true, giftMessage: 'Para Mateo, ¡feliz cumple 6! De la tía Ana.', transferProofUrl: null, items: [['MR-JUG-003', 1], ['MR-JUG-001', 1]] },\n  { id: 'MR-10419', createdAt: '2026-08-25T17:22:00', client: 'Nicolás Paz', phone: '11 6034-9917', dni: '27.884.331', fulfillmentType: 'pickup', branchId: 'b5', deliveryAddress: null, paymentMethod: 'mercadopago', paymentStatus: 'approved', orderStatus: 'delivered', shippingCost: 0, isGift: false, giftMessage: '', transferProofUrl: null, items: [['MR-JUG-002', 1], ['MR-JUG-003', 1]] }\n];\n\n/* OrderItem normalizado: unitPrice = precio al momento de la compra. */\nconst buildOrder = o => {\n  const items = o.items.map(([sku, quantity]) => {\n    const p = PRODUCTS[sku];\n    return { sku: p.sku, name: p.name, img: p.img, unitPrice: p.price, quantity, subtotal: p.price * quantity };\n  });\n  const subtotal = items.reduce((s, i) => s + i.subtotal, 0);\n  return Object.assign({}, o, { branchId: BRANCH.id, items, subtotal, total: subtotal + o.shippingCost, phoneE164: toE164(o.phone) });\n};\n\n/* ---------- Inventario (derivado; stock provisional — ver PSC-005) ---------- */\nconst CRITICAL_STOCK = 5;\nconst OPEN_PIPELINE = ['pending_payment', 'preparing', 'packed', 'ready_for_pickup'];\nfunction seedNum(str, mod) {\n  let h = 0;\n  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;\n  return h % mod;\n}\n/* Físico: simulado y determinístico (sin backend todavía). Reservado: derivado de pedidos abiertos reales. */\nfunction buildInventory(orders, adj) {\n  adj = adj || {};\n  const rows = [];\n  Object.values(PRODUCTS).forEach(p => {\n    BRANCHES.filter(b => b.id !== 'all').forEach(b => {\n      /* Rango 0–27: cubre sin stock, stock crítico y disponible. */\n      const physical = Math.max(seedNum(p.sku + b.id, 28) + (adj[p.sku] || 0), 0);\n      const reserved = orders\n        .filter(o => o.branchId === b.id && OPEN_PIPELINE.indexOf(o.orderStatus) >= 0)\n        .reduce((n, o) => n + o.items.filter(i => i.sku === p.sku).reduce((m, i) => m + i.quantity, 0), 0);\n      rows.push({ sku: p.sku, name: p.name, img: p.img, category: p.category, branchId: b.id, branchName: b.name, physical, reserved, available: Math.max(physical - reserved, 0) });\n    });\n  });\n  return rows;\n}\n\n/* ---------- Clientes (derivados de Order, sin entidad propia — ver PSC-006) ---------- */\nfunction buildCustomers(orders) {\n  const byPhone = {};\n  orders.forEach(o => {\n    const c = byPhone[o.phone] || (byPhone[o.phone] = { phone: o.phone, branchCounts: {}, orders: [] });\n    c.orders.push(o);\n    c.branchCounts[o.branchId] = (c.branchCounts[o.branchId] || 0) + 1;\n    if (!c.lastAt || o.createdAt > c.lastAt) { c.lastAt = o.createdAt; c.name = o.client; c.dni = o.dni; }\n  });\n  return Object.values(byPhone).map(c => {\n    const branchId = Object.keys(c.branchCounts).sort((a, b) => c.branchCounts[b] - c.branchCounts[a])[0];\n    const totalSpent = c.orders.filter(o => o.orderStatus !== 'cancelled').reduce((s, o) => s + o.total, 0);\n    return {\n      phone: c.phone, name: c.name, dni: c.dni, branchId,\n      ordersCount: c.orders.length, totalSpent, lastAt: c.lastAt,\n      orders: c.orders.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt))\n    };\n  }).sort((a, b) => b.lastAt.localeCompare(a.lastAt));\n}\n\n/* =========================================================================\n   Contratos de acceso · implementación DEMO local (localStorage).\n   Reemplazables por Supabase Auth + tabla `profiles` sin tocar la UI:\n   AuthService.signIn → supabase.auth.signInWithPassword\n   SessionService     → supabase.auth.getSession / onAuthStateChange\n   UserAccessService  → CRUD sobre `profiles` (name, email, role, status)\n   PermissionService  → mismas claves de permiso, validadas además por RLS\n   ========================================================================= */\nconst DEMO_PASSWORD = 'MegaDemo2026!';\nconst LS_USERS = 'mr.demo.users.v1';\nconst LS_SESSION = 'mr.demo.session.v1';\nconst LS_LOG = 'mr.demo.accesslog.v1';\n\nconst store = {\n  read(k, fb) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch (e) { return fb; } },\n  write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }\n};\n\n/* Usuarios de demostración. No son credenciales reales. */\nconst SEED_USERS = [\n  { id: 'u1', name: 'Sabrina Ríos', email: 'admin@megaregalos.demo', role: 'admin', status: 'active', password: DEMO_PASSWORD },\n  { id: 'u2', name: 'Martín Ocampo', email: 'encargado@megaregalos.demo', role: 'encargado', status: 'active', password: DEMO_PASSWORD },\n  { id: 'u3', name: 'Ayelén Costa', email: 'empleado@megaregalos.demo', role: 'empleado', status: 'active', password: DEMO_PASSWORD }\n];\n\nconst USER_STATUS_META = {\n  active: { label: 'Activo', ink: '#3E7A12', bg: '#EEF7E6' },\n  inactive: { label: 'Inactivo', ink: '#B07800', bg: '#FFF6E0' },\n  revoked: { label: 'Acceso revocado', ink: '#B3261E', bg: '#FDECEA' }\n};\n\nconst PERMISSIONS = {\n  admin: ['orders.operate', 'payments.approve', 'stock.view', 'customers.view', 'users.manage', 'config.manage'],\n  encargado: ['orders.operate', 'payments.approve', 'stock.view', 'customers.view'],\n  empleado: ['orders.operate', 'stock.view', 'customers.view']\n};\n\nconst PermissionService = {\n  can(user, permission) { return !!user && (PERMISSIONS[user.role] || []).indexOf(permission) >= 0; },\n  canView(user, view) {\n    if (!user) return false;\n    if (view === 'usuarios') return this.can(user, 'users.manage');\n    if (view === 'config') return this.can(user, 'config.manage');\n    return true;\n  }\n};\n\nconst UserAccessService = {\n  list() { const u = store.read(LS_USERS, null); if (!u || !u.length) { store.write(LS_USERS, SEED_USERS); return SEED_USERS.slice(); } return u; },\n  save(users) { store.write(LS_USERS, users); return users; },\n  log() { return store.read(LS_LOG, []); },\n  addLog(text) {\n    const l = [{ at: new Date().toISOString(), text }].concat(this.log()).slice(0, 30);\n    store.write(LS_LOG, l); return l;\n  }\n};\n\nconst SessionService = {\n  get() { return store.read(LS_SESSION, null); },\n  set(user) {\n    const s = { id: user.id, name: user.name, email: user.email, role: user.role, at: new Date().toISOString() };\n    store.write(LS_SESSION, s); return s;\n  },\n  clear() { store.write(LS_SESSION, null); return null; }\n};\n\nconst AUTH_ERROR = {\n  invalid: 'Email o contraseña incorrectos.',\n  inactive: 'Tu acceso está inactivo. Pedile al administrador que lo reactive.',\n  revoked: 'Tu acceso fue revocado. Contactá al administrador del local.',\n  email: 'Ingresá un email válido.',\n  password: 'Ingresá tu contraseña.'\n};\nconst EMAIL_RE = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n\nconst AuthService = {\n  validate(email, password) {\n    if (!EMAIL_RE.test(String(email).trim())) return AUTH_ERROR.email;\n    if (!String(password).length) return AUTH_ERROR.password;\n    return null;\n  },\n  signIn(email, password) {\n    return new Promise(resolve => setTimeout(() => {\n      const u = UserAccessService.list().find(x => x.email.toLowerCase() === String(email).trim().toLowerCase());\n      if (!u || u.password !== password) return resolve({ ok: false, error: AUTH_ERROR.invalid });\n      if (u.status !== 'active') return resolve({ ok: false, error: AUTH_ERROR[u.status] });\n      resolve({ ok: true, session: SessionService.set(u) });\n    }, 480));\n  },\n  signInDemo(role) {\n    const u = UserAccessService.list().find(x => x.role === role);\n    return u ? this.signIn(u.email, u.password) : Promise.resolve({ ok: false, error: AUTH_ERROR.invalid });\n  },\n  signOut() { return SessionService.clear(); }\n};\n\nconst LS_ADJ = 'mr.demo.stockadj.v1';\nconst LS_MOV = 'mr.demo.movements.v1';\n\n/* Matriz visual determinística por SKU. Representación de QR para la demo:\n   no codifica datos reales ni se escanea con cámara. */\nfunction qrMatrix(text) {\n  const n = 21, cells = [];\n  let h = 2166136261;\n  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }\n  let x = h || 12345;\n  const rnd = () => (x = (Math.imul(x, 1664525) + 1013904223) >>> 0) / 4294967296;\n  const box = (r, c, r0, c0) => r >= r0 && r < r0 + 7 && c >= c0 && c < c0 + 7;\n  const pat = (r, c, r0, c0) => { const d = Math.max(Math.abs(r - r0 - 3), Math.abs(c - c0 - 3)); return d <= 1 || d === 3; };\n  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {\n    let on;\n    if (box(r, c, 0, 0)) on = pat(r, c, 0, 0);\n    else if (box(r, c, 0, n - 7)) on = pat(r, c, 0, n - 7);\n    else if (box(r, c, n - 7, 0)) on = pat(r, c, n - 7, 0);\n    else on = rnd() > 0.52;\n    cells.push({ bg: on ? '#1E1A21' : '#ffffff' });\n  }\n  return cells;\n}\n\nconst MOVE_META = {\n  in: { label: 'Entrada', ink: '#3E7A12', bg: '#EEF7E6', sign: 1 },\n  out: { label: 'Salida', ink: '#B3261E', bg: '#FDECEA', sign: -1 },\n  adjust: { label: 'Ajuste', ink: '#7B1FA2', bg: '#F3F0FA', sign: 0 }\n};\n\nconst NAV = [\n  { key: 'inicio', label: 'Inicio', d: 'M4 11l8-6 8 6v8a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z' },\n  { key: 'pedidos', label: 'Pedidos', d: 'M8 4h8v3H8zM6 7h12v13H6zM9 12h6M9 16h4' },\n  { key: 'stock', label: 'Productos & Stock', d: 'M3 8l9-4 9 4v8l-9 4-9-4zM3 8l9 4 9-4M12 12v8' },\n  { key: 'clientes', label: 'Clientes', d: 'M4 20a6 6 0 0112 0M10 4a4 4 0 110 8 4 4 0 010-8M17 20a5 5 0 00-3-4.6' },\n  { key: 'b2b', label: 'B2B Cotizaciones', d: 'M7 20v-7m5 7V5m5 15v-10M4 20h16' },\n  { key: 'promos', label: 'Promociones', d: 'M4 12l8-8 8 8-8 8zM9.5 9.5h.01' },\n  { key: 'usuarios', label: 'Usuarios y accesos', d: 'M4 20a6 6 0 0110.5-4M11 4a4 4 0 110 8 4 4 0 010-8M17 17h5M19.5 14.5v5' },\n  { key: 'config', label: 'Configuración', d: 'M12 15a3 3 0 100-6 3 3 0 000 6M20.4 13l1.4-.7-1.6-3.4-1.7.5-1.8-1L16.2 3h-3.9l-.5 1.7-1.8 1-1.7-.5L6.7 8.6 8.1 9.3v3.4l-1.4.7 1.6 3.4 1.7-.5 1.8 1 .5 2.7h3.9l.5-2.7 1.8-1 1.7.5 1.6-3.4-1.4-.7z' }\n];\n\n/* Reloj de demo explícito y configurable (nunca escondido en KPIs).\n   Vaciar la prop demoClock para usar el reloj real del sistema. */\nconst DEMO_CLOCK = '2026-08-27T14:20:00';\n\nconst DFMT = iso => new Date(iso).toLocaleDateString('es-AR', { day: '2-digit', month: 'short' });\nconst TFMT = iso => new Date(iso).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });\nconst DAY = iso => String(iso).slice(0, 10);\n\nclass Component extends DCLogic {\n  state = {\n    view: 'inicio',\n    session: SessionService.get(),\n    users: UserAccessService.list(),\n    accessLog: UserAccessService.log(),\n    email: '', password: '', showPass: false, authError: '', authLoading: false,\n    userQ: '', userForm: null, confirm: null,\n    adjust: store.read(LS_ADJ, {}),\n    movements: store.read(LS_MOV, []),\n    qrSku: null, scanStep: null, scanAction: null, scanQty: '1', scanReason: '', scanError: '',\n    vw: typeof window !== 'undefined' ? window.innerWidth : 1280,\n    tab: 'todos',\n    q: '',\n    collapsed: false,\n    openId: null,\n    fulfillment: 'all',\n    paymentMethod: 'all',\n    range: 'all',\n    orders: SEED.map(buildOrder),\n    stockView: 'productos',\n    stockQ: '',\n    stockCategory: 'all',\n    stockBranchFilter: 'all',\n    custQ: '',\n    openCustomer: null,\n    toast: null,\n    toastKind: 'ok'\n  };\n\n  /* Reloj único del sistema. demoClock explícito para conservar la demo histórica. */\n  systemNow() {\n    const c = this.props.demoClock !== undefined ? this.props.demoClock : DEMO_CLOCK;\n    const d = c ? new Date(c) : new Date();\n    return isNaN(d.getTime()) ? new Date() : d;\n  }\n\n  /* ---------- QR demo · movimientos de stock simulados ---------- */\n  startScan() {\n    this.setState({ scanStep: 'scanning', scanAction: null, scanQty: '1', scanReason: '', scanError: '' });\n    setTimeout(() => { if (this.state.scanStep === 'scanning') this.setState({ scanStep: 'found' }); }, 900);\n  }\n  closeScan() { this.setState({ scanStep: null, scanAction: null, scanError: '' }); }\n  confirmMovement(product, available) {\n    const s = this.state, kind = s.scanAction;\n    const qty = parseInt(s.scanQty, 10);\n    if (!kind) return;\n    if (isNaN(qty) || qty < 0) return this.setState({ scanError: 'Ingresá una cantidad válida.' });\n    if (!s.scanReason.trim()) return this.setState({ scanError: 'Ingresá un motivo.' });\n    const before = available;\n    const after = kind === 'adjust' ? qty : Math.max(before + MOVE_META[kind].sign * qty, 0);\n    const delta = after - before;\n    const adj = Object.assign({}, s.adjust, { [product.sku]: (s.adjust[product.sku] || 0) + delta });\n    const mov = [{\n      at: new Date().toISOString(), sku: product.sku, name: product.name, kind, qty,\n      reason: s.scanReason.trim(), before, after,\n      user: s.session ? s.session.name : 'Demo', role: s.session ? ROLE_LABEL[s.session.role] : ''\n    }].concat(s.movements).slice(0, 40);\n    store.write(LS_ADJ, adj); store.write(LS_MOV, mov);\n    this.setState({ adjust: adj, movements: mov, scanStep: null, scanAction: null, qrSku: null, scanError: '' });\n    this.toast('DEMO · ' + MOVE_META[kind].label + ' registrada · ' + product.name + ' · stock ' + before + ' → ' + after);\n  }\n\n  actor() {\n    const u = this.state.session;\n    return { role: u ? u.role : 'empleado', assignedBranchId: BRANCH.id, user: u };\n  }\n\n  /* ---------- Sesión ---------- */\n  enterSession(session) {\n    const log = UserAccessService.addLog('Inicio de sesión · ' + session.name + ' (' + ROLE_LABEL[session.role] + ')');\n    this.setState({ session, accessLog: log, authLoading: false, email: '', password: '', authError: '', view: 'inicio', users: UserAccessService.list() });\n    this.toast('Sesión iniciada · ' + session.name + ' · ' + ROLE_LABEL[session.role]);\n  }\n  onLogin(e) {\n    if (e && e.preventDefault) e.preventDefault();\n    const { email, password } = this.state;\n    const v = AuthService.validate(email, password);\n    if (v) { this.setState({ authError: v }); return; }\n    this.setState({ authLoading: true, authError: '' });\n    AuthService.signIn(email, password).then(r => {\n      if (!r.ok) { this.setState({ authLoading: false, authError: r.error }); return; }\n      this.enterSession(r.session);\n    });\n  }\n  demoLogin(role) {\n    this.setState({ authLoading: true, authError: '' });\n    AuthService.signInDemo(role).then(r => {\n      if (!r.ok) { this.setState({ authLoading: false, authError: r.error }); return; }\n      this.enterSession(r.session);\n    });\n  }\n  signOut() {\n    const s = this.state.session;\n    AuthService.signOut();\n    const log = s ? UserAccessService.addLog('Cierre de sesión · ' + s.name) : this.state.accessLog;\n    this.setState({ session: null, accessLog: log, openId: null, openCustomer: null, view: 'inicio', userForm: null, confirm: null });\n  }\n\n  /* ---------- Usuarios y accesos ---------- */\n  commitUsers(users, logText) {\n    UserAccessService.save(users);\n    const log = logText ? UserAccessService.addLog(logText) : this.state.accessLog;\n    this.setState({ users, accessLog: log, confirm: null });\n    const me = this.state.session;\n    const mine = me ? users.find(u => u.id === me.id) : null;\n    if (me && (!mine || mine.status !== 'active')) {\n      AuthService.signOut();\n      this.setState({ session: null, openId: null, openCustomer: null });\n      this.toast('Tu propio acceso dejó de estar activo: se cerró la sesión.', 'warn');\n      return;\n    }\n    if (logText) this.toast(logText);\n  }\n  setUserStatus(u, status) {\n    const verb = status === 'active' ? 'acceso activado' : status === 'inactive' ? 'acceso desactivado' : 'acceso revocado';\n    this.commitUsers(this.state.users.map(x => x.id === u.id ? Object.assign({}, x, { status }) : x), u.name + ' · ' + verb);\n  }\n  setUserRole(u, role) {\n    this.commitUsers(this.state.users.map(x => x.id === u.id ? Object.assign({}, x, { role }) : x), u.name + ' · rol cambiado a ' + ROLE_LABEL[role]);\n  }\n  resetUserAccess(u) {\n    this.commitUsers(this.state.users.map(x => x.id === u.id ? Object.assign({}, x, { status: 'active', password: DEMO_PASSWORD }) : x), u.name + ' · acceso demo restablecido');\n  }\n  invalidateUserSession(u) {\n    const me = this.state.session;\n    if (me && me.id === u.id) { this.signOut(); this.toast('Sesión cerrada.', 'warn'); return; }\n    this.setState({ accessLog: UserAccessService.addLog('Sesión simulada invalidada · ' + u.name), confirm: null });\n    this.toast('Sesión simulada de ' + u.name + ' invalidada.');\n  }\n  saveUserForm() {\n    const f = this.state.userForm;\n    if (!f) return;\n    const name = f.name.trim(), email = f.email.trim().toLowerCase();\n    if (!name) return this.setState({ userForm: Object.assign({}, f, { error: 'Ingresá el nombre.' }) });\n    if (!EMAIL_RE.test(email)) return this.setState({ userForm: Object.assign({}, f, { error: 'Ingresá un email válido.' }) });\n    if (this.state.users.some(u => u.email.toLowerCase() === email && u.id !== f.id)) return this.setState({ userForm: Object.assign({}, f, { error: 'Ya existe un usuario con ese email.' }) });\n    let users, msg;\n    if (f.mode === 'create') {\n      users = this.state.users.concat([{ id: 'u' + Date.now(), name, email, role: f.role, status: f.status, password: DEMO_PASSWORD }]);\n      msg = 'Usuario demo creado · ' + name + ' (' + ROLE_LABEL[f.role] + ')';\n    } else {\n      users = this.state.users.map(u => u.id === f.id ? Object.assign({}, u, { name, email, role: f.role, status: f.status }) : u);\n      msg = 'Usuario actualizado · ' + name;\n    }\n    this.setState({ userForm: null });\n    this.commitUsers(users, msg);\n  }\n\n  componentDidMount() {\n    this._key = e => {\n      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {\n        e.preventDefault();\n        if (this.searchEl) this.searchEl.focus();\n      }\n      if (e.key === 'Escape' && this.state.openId) this.closeDrawer();\n    };\n    window.addEventListener('keydown', this._key);\n    this._resize = () => {\n      if (this._raf) return;\n      this._raf = requestAnimationFrame(() => { this._raf = null; this.setState({ vw: window.innerWidth }); });\n    };\n    window.addEventListener('resize', this._resize);\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this._key); window.removeEventListener('resize', this._resize); if (this._t) clearTimeout(this._t); }\n\n  toast(msg, kind) {\n    if (this._t) clearTimeout(this._t);\n    this.setState({ toast: msg, toastKind: kind || 'ok' });\n    this._t = setTimeout(() => this.setState({ toast: null }), 4200);\n  }\n\n  openDrawer(id) { this._lastFocus = document.activeElement; this.setState({ view: 'pedidos', openId: id, openCustomer: null }); }\n  closeDrawer() {\n    this.setState({ openId: null });\n    if (this._lastFocus && this._lastFocus.focus) this._lastFocus.focus();\n  }\n  openCustomerDrawer(phone) { this._lastFocus = document.activeElement; this.setState({ openCustomer: phone, openId: null }); }\n  closeCustomerDrawer() {\n    this.setState({ openCustomer: null });\n    if (this._lastFocus && this._lastFocus.focus) this._lastFocus.focus();\n  }\n\n  /* Toda mutación de pedidos pasa por acá. */\n  run(order, action) {\n    const actor = this.actor();\n    const patch = transitionOrder(order, action, actor);\n    if (!patch) {\n      const why = canTransition(order, action, actor).reason;\n      this.toast('Acción no permitida: ' + why, 'warn');\n      return;\n    }\n    this.setState(s => ({ orders: s.orders.map(o => o.id === order.id ? Object.assign({}, o, patch) : o) }));\n    let msg = order.id + ' · ' + ACTION_LABEL[action];\n    if (patch.orderStatus) msg += ' → ' + STATUS_META[patch.orderStatus].label;\n    if (action === 'mark_delivered' && patch.paymentStatus === 'approved') msg += ' · efectivo cobrado';\n    this.toast(msg, action === 'reject_payment' || action === 'cancel' ? 'warn' : 'ok');\n  }\n\n  renderVals() {\n    const s = this.state;\n    const actor = this.actor();\n    const now = this.systemNow();\n    const todayKey = now.toISOString().slice(0, 10);\n    const orders = s.orders;\n\n    /* Alcance: admin usa el selector de vista; los roles restringidos, su asignación. */\n    const scopeId = BRANCH.id;\n    const scoped = orders;\n\n    const q = s.q.trim().toLowerCase();\n    const matches = o => !q || o.id.toLowerCase().includes(q) || o.client.toLowerCase().includes(q) || o.dni.replace(/\\./g, '').includes(q.replace(/\\./g, ''));\n    const inRange = o => {\n      if (s.range === 'all') return true;\n      if (s.range === 'today') return DAY(o.c
